# Reusable workflow: posts external GitHub interactions to Discord
# Called by repos with: uses: prestomation/.github/.github/workflows/notify-discord.yml@main
#
# The webhook URL can be supplied either as the `webhook-url` input (preferred)
# or via the `DISCORD_WEBHOOK_URL` secret (fallback, for backward compatibility
# with existing callers). The input takes precedence when both are provided.
#
# Handles: issues, PRs, comments, reviews, and all release publishes (including pre-releases).
# Discord URL previews are suppressed to keep messages compact.
#
# Security note: every value that originates from the GitHub event payload is
# attacker-controlled (anyone who can comment can set it). Such values are passed
# into the step through `env:` and never inlined into `run:` as a `${{ }}`
# expression, because an inlined expression is substituted into the script text
# before bash parses it and no amount of quoting can make it safe. The Discord
# payload is assembled with `jq --arg`, so untrusted text is escaped as JSON data
# rather than interpolated into a shell or JSON string.

name: Notify Discord

on:
  workflow_call:
    inputs:
      webhook-url:
        description: 'Discord webhook URL. Overrides the DISCORD_WEBHOOK_URL secret when provided.'
        type: string
        required: false
    secrets:
      DISCORD_WEBHOOK_URL:
        required: false

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Build and send Discord notification
        env:
          DISCORD_WEBHOOK_URL: ${{ inputs.webhook-url || secrets.DISCORD_WEBHOOK_URL }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action }}
          REPO: ${{ github.repository }}
          ACTOR: ${{ github.event.sender.login }}
          # --- Untrusted event payload fields (never inline these into run:) ---
          ISSUE_URL: ${{ github.event.issue.html_url }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_USER: ${{ github.event.issue.user.login }}
          ISSUE_AVATAR: ${{ github.event.issue.user.avatar_url }}
          ISSUE_PR_URL: ${{ github.event.issue.pull_request.url }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_USER: ${{ github.event.pull_request.user.login }}
          PR_AVATAR: ${{ github.event.pull_request.user.avatar_url }}
          COMMENT_URL: ${{ github.event.comment.html_url }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          COMMENT_USER: ${{ github.event.comment.user.login }}
          COMMENT_AVATAR: ${{ github.event.comment.user.avatar_url }}
          REVIEW_URL: ${{ github.event.review.html_url }}
          REVIEW_BODY: ${{ github.event.review.body }}
          REVIEW_USER: ${{ github.event.review.user.login }}
          REVIEW_AVATAR: ${{ github.event.review.user.avatar_url }}
          RELEASE_URL: ${{ github.event.release.html_url }}
          RELEASE_NAME: ${{ github.event.release.name }}
          RELEASE_BODY: ${{ github.event.release.body }}
          RELEASE_USER: ${{ github.event.release.author.login }}
          RELEASE_AVATAR: ${{ github.event.release.author.avatar_url }}
          RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          set -euo pipefail

          # --- Guard: a webhook URL is required (input or secret) ---
          if [[ -z "$DISCORD_WEBHOOK_URL" ]]; then
            echo "No Discord webhook URL provided. Pass it via the 'webhook-url' input or set the DISCORD_WEBHOOK_URL secret."
            exit 1
          fi

          # --- Filter: skip own activity and bots ---
          SKIP_USERS="prestomation dependabot[bot] github-actions[bot] renovate[bot] pre-commit-ci[bot] amazon-q-developer[bot]"
          for u in $SKIP_USERS; do
            if [[ "$ACTOR" == "$u" ]]; then
              echo "Skipping internal actor: $ACTOR"
              exit 0
            fi
          done

          # --- Determine event details ---
          case "$EVENT_NAME" in
            issues)
              OBJ_URL="$ISSUE_URL"
              OBJ_TITLE="$ISSUE_TITLE"
              OBJ_NUM="#${ISSUE_NUMBER}"
              OBJ_BODY="$ISSUE_BODY"
              AUTHOR="$ISSUE_USER"
              AUTHOR_AVATAR="$ISSUE_AVATAR"
              case "$EVENT_ACTION" in
                opened)   COLOR=5763719;  ACTION="Issue opened";;
                edited)   COLOR=3447003;  ACTION="Issue edited";;
                closed)   COLOR=15158332; ACTION="Issue closed";;
                reopened) COLOR=3066993;  ACTION="Issue reopened";;
                *)        echo "Unhandled issue action: $EVENT_ACTION"; exit 0;;
              esac
              ;;
            pull_request)
              OBJ_URL="$PR_URL"
              OBJ_TITLE="$PR_TITLE"
              OBJ_NUM="#${PR_NUMBER}"
              OBJ_BODY="$PR_BODY"
              AUTHOR="$PR_USER"
              AUTHOR_AVATAR="$PR_AVATAR"
              case "$EVENT_ACTION" in
                opened)      COLOR=5763719;  ACTION="PR opened";;
                edited)      COLOR=3447003;  ACTION="PR edited";;
                closed)      COLOR=15158332; ACTION="PR closed";;
                reopened)    COLOR=3066993;  ACTION="PR reopened";;
                review_requested) COLOR=15844397; ACTION="Review requested";;
                *)           echo "Unhandled PR action: $EVENT_ACTION"; exit 0;;
              esac
              ;;
            issue_comment)
              OBJ_URL="$COMMENT_URL"
              OBJ_TITLE="$ISSUE_TITLE"
              OBJ_NUM="#${ISSUE_NUMBER}"
              OBJ_BODY="$COMMENT_BODY"
              AUTHOR="$COMMENT_USER"
              AUTHOR_AVATAR="$COMMENT_AVATAR"
              COLOR=3447003
              if [[ -z "$ISSUE_PR_URL" ]]; then
                ACTION="Comment on issue"
              else
                ACTION="Comment on PR"
              fi
              ;;
            pull_request_review)
              OBJ_URL="$REVIEW_URL"
              OBJ_TITLE="$PR_TITLE"
              OBJ_NUM="#${PR_NUMBER}"
              OBJ_BODY="$REVIEW_BODY"
              AUTHOR="$REVIEW_USER"
              AUTHOR_AVATAR="$REVIEW_AVATAR"
              case "$EVENT_ACTION" in
                submitted)  COLOR=5763719;  ACTION="Review submitted";;
                edited)     COLOR=3447003;  ACTION="Review edited";;
                dismissed)  COLOR=15158332; ACTION="Review dismissed";;
                *)          echo "Unhandled review action: $EVENT_ACTION"; exit 0;;
              esac
              ;;
            pull_request_review_comment)
              OBJ_URL="$COMMENT_URL"
              OBJ_TITLE="$PR_TITLE"
              OBJ_NUM="#${PR_NUMBER}"
              OBJ_BODY="$COMMENT_BODY"
              AUTHOR="$COMMENT_USER"
              AUTHOR_AVATAR="$COMMENT_AVATAR"
              COLOR=3447003
              ACTION="Review comment"
              ;;
            release)
              if [[ "$EVENT_ACTION" != "published" ]]; then
                echo "Skipping release action: $EVENT_ACTION"
                exit 0
              fi
              OBJ_URL="$RELEASE_URL"
              OBJ_TITLE="$RELEASE_NAME"
              OBJ_NUM=""
              OBJ_BODY="$RELEASE_BODY"
              AUTHOR="$RELEASE_USER"
              AUTHOR_AVATAR="$RELEASE_AVATAR"
              if [[ "$RELEASE_PRERELEASE" == "true" ]]; then
                COLOR=15844397
                ACTION="Pre-release published"
              else
                COLOR=5763719
                ACTION="Released"
              fi
              ;;
            *)
              echo "Unhandled event: $EVENT_NAME"
              exit 0
              ;;
          esac

          # --- Truncate body to ~300 chars ---
          if [[ ${#OBJ_BODY} -gt 300 ]]; then
            BODY_SNIPPET="${OBJ_BODY:0:300}..."
          else
            BODY_SNIPPET="$OBJ_BODY"
          fi

          # --- Build Discord embed JSON ---
          READABLE_REPO="${REPO#prestomation/}"
          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          # For releases, put version in title; for others, use issue/PR number
          if [[ "$EVENT_NAME" == "release" ]]; then
            EMBED_TITLE="${ACTION}: ${OBJ_TITLE}"
          else
            EMBED_TITLE="${ACTION}: ${OBJ_TITLE} (${OBJ_NUM})"
          fi

          # COLOR is set by every branch above, but --argjson aborts on anything
          # that is not valid JSON, so fall back to the neutral blue if it is not
          # a plain integer.
          if ! [[ "${COLOR:-}" =~ ^[0-9]+$ ]]; then
            COLOR=3447003
          fi

          # Every untrusted value is passed as a jq argument and encoded as JSON
          # data. Nothing below is expanded by the shell or spliced into a string.
          PAYLOAD=$(jq -n \
            --arg title "$EMBED_TITLE" \
            --arg url "$OBJ_URL" \
            --arg description "$BODY_SNIPPET" \
            --arg author "$AUTHOR in $READABLE_REPO" \
            --arg icon "$AUTHOR_AVATAR" \
            --arg footer "$REPO" \
            --arg ts "$TIMESTAMP" \
            --argjson color "$COLOR" \
            '{
              username: "GitHub Notify",
              suppress_embeds: true,
              embeds: [
                {
                  title: $title,
                  url: $url,
                  description: ($description | gsub("^\\s+|\\s+$"; "")),
                  color: $color,
                  author: { name: $author, icon_url: $icon },
                  footer: { text: $footer },
                  timestamp: $ts
                }
                # Discord rejects an empty description; drop the key instead.
                | if .description == "" then del(.description) else . end
                | if .url == "" then del(.url) else . end
              ]
            }')

          # --- Send to Discord ---
          RESPONSE=$(printf '%s' "$PAYLOAD" | curl -s -w "\n%{http_code}" -X POST \
            -H "Content-Type: application/json" \
            --data-binary @- \
            "$DISCORD_WEBHOOK_URL")

          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | head -n -1)

          if [[ "$HTTP_CODE" -ge 200 && "$HTTP_CODE" -lt 300 ]]; then
            echo "Discord notification sent successfully (HTTP $HTTP_CODE)"
          else
            echo "Failed to send Discord notification (HTTP $HTTP_CODE)"
            echo "Response: $BODY"
            exit 1
          fi
